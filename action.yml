name: onopen
description: Scan a repository for code that runs automatically when it is opened, installed or trusted
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Directory to scan
    default: .
  fail-on:
    description: "Fail at or above this severity: info|low|medium|high|critical|none"
    default: high
  sarif-file:
    description: Where to write SARIF output (uploaded to code scanning when upload-sarif is true)
    default: onopen.sarif
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (needs security-events write permission)
    default: "false"
runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      env:
        OO_PATH: ${{ inputs.path }}
        OO_FAIL: ${{ inputs.fail-on }}
        OO_SARIF: ${{ inputs.sarif-file }}
      run: |
        node "${{ github.action_path }}/bin/onopen.js" "$OO_PATH" --format sarif --fail-on none > "$OO_SARIF"
        node "${{ github.action_path }}/bin/onopen.js" "$OO_PATH" --fail-on "$OO_FAIL" --no-color
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
