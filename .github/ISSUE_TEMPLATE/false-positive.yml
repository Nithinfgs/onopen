name: False positive
description: A rule fired on something that is fine
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: OO012 }
    validations: { required: true }
  - type: textarea
    id: snippet
    attributes:
      label: The config or command that was flagged
      description: Minimal and sanitized. No real tokens.
      render: text
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why is this safe or expected? }
  - type: input
    id: version
    attributes: { label: onopen version, placeholder: "0.1.0" }
